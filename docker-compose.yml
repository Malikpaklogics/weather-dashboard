version: '3.8'

services:
  server:
    build: ./server
    ports:
      - '5000:5000'
    environment:
      - PORT=5000
      - OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY}
    volumes:
      - ./server:/app
      - /app/node_modules

  client:
    build: ./client
    ports:
      - '3000:3000'
    depends_on:
      - server
    volumes:
      - ./client:/app
      - /app/node_modules
